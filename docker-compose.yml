services:
  spk-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spk-app:latest
    container_name: spk-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
    ports:
      - "3010:3010"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
